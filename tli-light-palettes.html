<title>TLI Light Palettes</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
/>
<!--
  SWATCH TEMPLATE
  Edit only the CONFIG object in the <script> at the bottom (or let swatch_kit.py fill the CONFIG placeholder). Contrast ratios are computed live.
  swatch fields: hex (required), name, use, pick (bool), fg (text color, default auto white/navy),
                 on (optional backdrop hex: shows the swatch as a card sitting on that background),
                 border (hex: draws the card edge), borders ([{hex,label}]: border options; add default:true to pick the one previewed first; each shows
                 as a square in a split chip above the preview box and as a row in a "Border options" accordion with its own Copy; clicking a chip or row previews it),
                 overlays ([{hex,label}]: fill variants, -3 to +3 steps; split strip of squares inside the preview box (one 1px outline around the whole strip in the current border color) plus an "Overlay options" accordion; clicking one previews it on the right half of the box beside the original; clicking the original half or the same overlay again clears it),
                 texts ([{hex,label}]: text color options for this fill; the first is the default. "Aa" + "Small text" sits bottom-left of the preview box, and a second copy bottom-right appears only while an overlay is
                 previewed, so it shows the text on the overlay; the text chips sit below the box in the stage's bottom-right with a "Text options" label, plus a "Text options" accordion and a Text row in Selected colors),
                 layout ({eyebrow,h,cardH,cardP,ctaLabel,accent,muted,cta,card,cardBorder}: section rows. The preview becomes a 4:3 box with an eyebrow + headline and a card
                 (eyebrow, headline, body, button) in the left half; the right half repeats it only while an overlay is previewed. Headlines use the current text option),
                 text (bool, with on: shows hex as type on the backdrop, contrast measured against the backdrop)
  extra ({k:{label,var,opts:[{hex,label}],def}}: section rows only. Labeled chip groups: key 'a' joins Overlay and Text in the top bar, the rest form the bottom bar;
                 each sets its CSS variable on the preview (--acc, --cbg, --cbd, --cacc, --ctx headline, --cmut body, --cta) and adds a Selected colors row;
                 the template adds a 'cp' Card body key after 'ct' (relabelled Card headline) from each theme's mut + text list),
  group fields: title, sub, swatches, one (bool: one swatch per row), compact (bool: brand-color strip of chips with Copy, no options)
                 swatches with borders or overlays also get a reset icon (top left of the stage, shown only after the preview changes) and a "Selected colors" section (above the accordions)
  pairing fields: title, sub, bg, tag, tagColor, heading, headFg, cardBg, cardFg, cardBorder, linkColor, button (bool), btnColor, cards:[{h,p,cta}]
  stacked pairing: stack:[{bg,n,kind:'text'|'cards'|'cta',h,p}] plus muted, headFg, tagColor, cardBg, cardBorder, cardFg, btnColor, cards
-->
<style>
  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --ink: #1b2a41;
    --muted: #4a5568;
    --line: #e1e7ef;
    --accent: #9c3d3a;
    --accent-soft: #f6eef0;
    --display: 'Playfair Display', Georgia, serif;
    --body: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --bg: #0f1724;
      --surface: #172234;
      --ink: #e6ecf4;
      --muted: #a3b0c2;
      --line: #26344a;
      --accent: #e39a95;
      --accent-soft: #2a1e24;
      color-scheme: dark;
    }
  }
  :root[data-theme='dark'] {
    --bg: #0f1724;
    --surface: #172234;
    --ink: #e6ecf4;
    --muted: #a3b0c2;
    --line: #26344a;
    --accent: #e39a95;
    --accent-soft: #2a1e24;
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 var(--body);
  }
  .wrap {
    --gut: 80px;
    max-width: calc(1440px + 2 * var(--gut));
    margin: 0 auto;
    padding-block: 40px 64px;
    padding-left: max(var(--gut), env(safe-area-inset-left, 0px));
    padding-right: max(var(--gut), env(safe-area-inset-right, 0px));
    display: grid;
    gap: 44px;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--muted);
  }
  h1 {
    font: 400 clamp(28px, 4vw, 40px)/1.15 var(--display);
    margin: 6px 0 8px;
    text-wrap: balance;
  }
  h2 {
    font: 400 24px/1.2 var(--display);
    margin: 0 0 4px;
    text-wrap: balance;
  }
  .lede,
  .sub {
    color: var(--muted);
    margin: 0;
    max-width: 65ch;
  }
  section {
    display: grid;
    gap: 16px;
  }
  .anchor {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .anchor .chip {
    width: 64px;
    height: 64px;
    border-radius: 8px;
    flex: none;
  }
  .anchor .hex {
    font: 400 20px var(--mono);
  }
  .row {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }
  @media (max-width: 900px) {
    .row {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }
  @media (max-width: 900px) {
    .wrap {
      --gut: 16px;
    }
  } /* 1440px content, 80px side margins; 16px on narrow screens */
  @media (max-width: 560px) {
    .row {
      grid-template-columns: minmax(0, 1fr);
    }
  }
  .sw {
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
    display: grid;
    grid-template-rows: auto 1fr;
    min-width: 0;
  }
  .sw .c {
    aspect-ratio: 1/1;
    max-width: 100%;
    padding: 14px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    font-weight: 600;
    position: relative;
  }
  .sw .c .tx {
    display: grid;
    gap: 2px;
    align-content: end;
  }
  .sw .c .tx .h {
    font: 400 30px/1.1 var(--display);
  }
  .sw .c .tx .cap {
    font: 500 13px var(--body);
  }
  .sw .c .tx2 {
    text-align: right;
    justify-items: end;
    visibility: hidden;
  }
  .sw .c.ov .tx2 {
    visibility: visible;
  }
  .twrap {
    position: absolute;
    bottom: 11px;
    right: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sw .rt {
    font: 500 12px var(--mono);
    color: var(--ink);
    margin-left: 6px;
  }
  .sw .stage {
    aspect-ratio: 1/1;
    max-width: 100%;
    padding: 44px 16px;
    display: grid;
    position: relative;
    --chip: 22px;
  }
  .sw .stage .c {
    aspect-ratio: auto;
    border-radius: 6px;
    border: 1px solid transparent;
  }
  .chips {
    display: flex;
    border-radius: 5px;
    overflow: hidden;
  }
  .chips button {
    border: 0;
    padding: 0;
    margin: 0;
    cursor: pointer;
    display: block;
  }
  .chips button:focus-visible {
    outline: 2px solid #fff;
    outline-offset: -2px;
  }
  .chips button {
    width: var(--chip, 22px);
    height: var(--chip, 22px);
  }
  .bwrap {
    position: absolute;
    top: 11px;
    right: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .blab {
    font: 600 11px var(--body);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.8;
    white-space: nowrap;
  }
  .ochips {
    position: absolute;
    top: 10px;
    left: 10px;
    border: 1px solid var(--bd, transparent);
  }
  .sw .acc {
    border-top: 1px solid var(--line);
    margin-top: 8px;
    padding-top: 8px;
  }
  .sw .acc summary {
    font: 600 11px var(--body);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    list-style: none;
    padding-block: 2px;
  }
  .sw .acc summary::-webkit-details-marker {
    display: none;
  }
  .sw .acc summary::after {
    content: '+';
    font: 500 14px var(--mono);
    letter-spacing: 0;
  }
  .sw .acc[open] > summary::after {
    content: '\2212';
  }
  .sw .acc summary .cur {
    font: 500 12px var(--mono);
    letter-spacing: 0;
    text-transform: none;
    color: var(--ink);
    margin-left: auto;
  }
  .sw .acc summary:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .sw .opts {
    display: grid;
    gap: 6px;
    padding-top: 8px;
  }
  .sw .opt,
  .sw .srow {
    display: grid;
    grid-template-columns: 12px minmax(0, 1fr) auto;
    gap: 8px;
    align-items: center;
    padding: 4px 6px;
    margin-inline: -7px;
    border: 1px solid transparent;
    border-radius: 6px;
    font: 500 13px var(--mono);
    color: var(--ink);
  }
  .sw .opt.on {
    border-color: var(--muted);
  }
  .sw .srow {
    padding-inline: 0;
    margin-inline: 0;
  }
  .sw .sel {
    border-top: 1px solid var(--line);
    margin-top: 8px;
    padding-top: 8px;
    display: grid;
    gap: 6px;
  }
  .sw .sel .bh {
    font: 600 11px var(--body);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  /* details panel mirrors the controls: Section controls, then Card themes; rows that share a pill sit in one .sg group with a rule */
  .sw .sel .sh {
    font: 600 10px var(--body);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0.8;
    margin-top: 6px;
  }
  .sw .sg {
    display: grid;
    gap: 6px;
  }
  /* rows sharing a pill stay in line; a vertical line through the swatch column joins them (swatches are 12px, centered in each row) */
  .sw .sg > .srow {
    position: relative;
  }
  .sw .sg > .srow:not(:last-child)::after,
  .sw .sg > .srow:not(:first-child)::before {
    content: '';
    position: absolute;
    left: 5.5px;
    width: 1px;
    background: var(--muted);
    opacity: 0.55;
  }
  .sw .sg > .srow:not(:last-child)::after {
    top: calc(75% + 4.5px);
    bottom: -7px;
  } /* each joint is half the swatch-to-swatch distance, centered */
  .sw .sg > .srow:not(:first-child)::before {
    top: -1px;
    bottom: calc(75% + 4.5px);
  }
  /* in the accordions the grouped headers keep their alignment; the line sits in the box's left padding */
  .sw .nest > .sg {
    position: relative;
  }
  .sw .nest > .sg::before {
    content: '';
    position: absolute;
    left: -6px;
    top: 12px;
    bottom: 12px;
    width: 1px;
    background: var(--muted);
    opacity: 0.55;
  }
  .sw .nest .sg {
    gap: 0;
    margin-top: 8px;
  }
  .sw .nest > .sg:first-child {
    margin-top: 0;
  }
  .sw .nest .sg > .acc:first-child {
    margin-top: 0;
  }
  .reset {
    position: absolute;
    top: 10px;
    left: 16px;
    width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    border: 0;
    padding: 0;
    background: transparent;
    border-radius: 5px;
    cursor: pointer;
    opacity: 0.75;
  }
  .reset[hidden] {
    display: none;
  }
  .reset:hover {
    opacity: 1;
  }
  .reset:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 1px;
  }
  .sw .opt i,
  .sw .srow i {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.2);
  }
  .sw .srow .bl,
  .sw .opt .bl {
    display: grid;
    gap: 0;
    min-width: 0;
  }
  .sw .srow .bl small,
  .sw .opt .bl small {
    font: 400 12px var(--body);
    color: var(--muted);
  }
  .sw .meta {
    padding: 12px 14px;
    display: grid;
    gap: 4px;
    align-content: start;
  }
  .sw .meta b {
    font: 500 15px var(--mono);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .sw .meta span {
    color: var(--muted);
    font-size: 14px;
  }
  .sw .meta .nm {
    color: var(--ink);
    font-weight: 600;
  }
  .pick {
    font: 600 11px var(--body);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 4px;
    padding: 1px 6px;
    font-style: normal;
    margin-left: 6px;
  }
  .grade {
    font: 600 11px var(--body);
    letter-spacing: 0.06em;
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 6px;
  }
  button.copy {
    font: 500 12px var(--body);
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 2px 10px;
    cursor: pointer;
  }
  button.copy:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .demo {
    border-radius: 12px;
    padding: 40px max(16px, 4vw);
    display: grid;
    gap: 20px;
  }
  .demo .tag {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .demo h3 {
    font: 400 clamp(24px, 3vw, 32px)/1.2 var(--display);
    margin: 0;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
    gap: 16px;
  }
  .card {
    border-radius: 8px;
    padding: 22px;
    display: grid;
    gap: 10px;
    align-content: start;
    min-width: 0;
  }
  .card h4 {
    font: 500 19px/1.3 var(--body);
    margin: 0;
  }
  .card p {
    margin: 0;
    font-size: 15px;
  }
  .card a {
    font-weight: 600;
    font-size: 14px;
  }
  .btn {
    justify-self: start;
    font: 600 13px var(--body);
    padding: 7px 16px;
    border-radius: 999px;
    background: #9c3d3a;
    color: #fff;
  }
  .stackwrap {
    border: 1px solid rgba(24, 46, 86, 0.16);
    border-radius: 14px;
    padding: 12px;
  }
  .stack {
    border-radius: 8px;
    overflow: hidden;
    display: grid;
  }
  .stack .demo {
    border-radius: 0;
  }
  .stack .lead {
    margin: 0;
    max-width: 62ch;
    font-size: 16px;
  }
  .stack .cta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .note {
    font-size: 14px;
    color: var(--muted);
    max-width: 70ch;
    margin: 0;
  }
  /* brand colors as a compact strip */
  .brandrow {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .bchip {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 10px 4px 4px;
    background: var(--surface);
    font-size: 14px;
  }
  .bchip i {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.15);
  }
  .bchip code {
    font: 500 13px var(--mono);
    color: var(--muted);
  }
  /* section rows: one background per row, 2:1 preview with type and a card; details beside it */
  .row.one {
    grid-template-columns: minmax(0, 1fr);
  }
  .sw.wide {
    grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr);
    grid-template-rows: auto;
  }
  .sw.wide .stage {
    aspect-ratio: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  /* labeled option bars: overlay/accent/text above the preview, card options below */
  .cbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    min-height: 24px;
  }
  .cgrp .stchips { gap: 2px; border: 0; border-radius: 0; overflow: visible; }
  .cgrp .stchips button { width: calc(var(--chip, 22px) * 3); border-radius: 3px; box-shadow: 0 0 0 1px var(--bd, transparent); }
  .cbar .cbreak { flex-basis: 100%; height: 0; }
  .cbar.top {
    padding-left: 32px;
    justify-content: flex-start;
    align-items: flex-start;
  }
  .cgrid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .ctitle {
    flex-basis: 100%;
    font: 600 11px var(--body);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.8;
  }
  .sw .nest {
    display: grid;
    padding: 0 10px 8px;
    margin-top: 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
  } /* outlined box: its rows are children of the group heading */
  .sw .nest > .acc:first-child,
  .sw .nest > .sg:first-child > .acc:first-child {
    border-top: 0;
  }
  .sw .sbox {
    display: grid;
    gap: 6px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .sw .nest .acc {
    margin-top: 4px;
  }
  .reset {
    z-index: 1;
  }
  .cgrp {
    display: flex;
    flex-wrap: wrap;
    row-gap: 4px;
    max-width: 100%;
    align-items: center;
    gap: 8px;
    padding: 3px 3px 3px 10px;
    border: 1px solid var(--bd, currentColor);
    border-radius: 6px;
  }
  .cgrp .chips {
    border-radius: 3px;
    border: 1px solid var(--bd, transparent);
  }
  .cgrp .cdiv {
    align-self: stretch;
    width: 1px;
    margin: -3px 2px;
    background: var(--bd, currentColor);
  } /* one pill per text group: section Text | Accent, card Headline | Body | Accent; the accent list follows the text */
  .sw.wide .ochips {
    position: static;
    border: 1px solid var(--bd, transparent);
  }
  .sw.wide .stage .c {
    aspect-ratio: 4/3;
    padding: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    align-items: stretch;
    min-width: 0;
    overflow: hidden;
  }
  .sw.wide .stage .c.ov {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  }
  .lay {
    padding: 20px 17.5%;
    display: grid;
    align-content: center;
    justify-items: center;
    gap: 14px;
    min-width: 0;
  }
  .c.ov .lay {
    padding: 20px 16px;
  }
  .lay > .hl {
    margin-bottom: 0;
  }
  .lay > .sp {
    margin: -4px 0 20px;
    max-width: 46ch;
    text-align: center;
    font: 400 15px/1.5 var(--body);
  }
  .lay > .eb,
  .lay > .hl {
    text-align: center;
  }
  .sw .c .lay.tx2 {
    text-align: left;
    justify-items: center;
    display: none;
  }
  .sw .c.ov .lay.tx2 {
    display: grid;
  }
  .lay .eb {
    font: 600 11px var(--body);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .lay .hl {
    font: 400 24px/1.15 var(--display);
    margin: 0;
  }
  .lay .cd {
    border-radius: 10px;
    padding: 22px;
    display: grid;
    gap: 10px;
    border: 1px solid;
    width: 100%;
  }
  .lay .cd .hl {
    font-size: 22px;
  }
  .lay .cd p {
    margin: 0;
    font: 400 15px/1.5 var(--body);
  }
  .lay .cd .cta {
    justify-self: start;
    font: 600 13px var(--body);
    padding: 8px 18px;
    border-radius: 999px;
    color: #fff;
  }
  @media (max-width: 900px) {
    .sw.wide {
      grid-template-columns: minmax(0, 1fr);
    }
  }
  @media (max-width: 560px) {
    .sw.wide .stage .c {
      aspect-ratio: auto;
      grid-template-columns: minmax(0, 1fr);
    }
  }

  /* sticky palette bar: names the palette in view and jumps between palettes */
  .pbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .pbar .in{--gut:80px;max-width:calc(1440px + 2*var(--gut));margin:0 auto;padding:10px max(var(--gut),env(safe-area-inset-right,0px)) 10px max(var(--gut),env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;position:relative}
  @media (max-width:900px){.pbar .in{--gut:16px}}
  .pbar .lbl{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}

  /* page-order sections are accordions: each band is the summary, its preview and options open underneath */
  .stack details.band>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px max(16px,4vw);border-top:1px solid color-mix(in srgb,currentColor 22%,transparent)}

  .stack .bandbody{padding:0;background:var(--bg);border-top:1px solid var(--line)}

  /* page header: title and summary on the left, a short reading guide on the right */
  .hdr{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px 72px;align-items:end}

  function lum(hex) {

      { b: 'bd', o: 'bg', t: 'tx' }[k],
      hex,
      off ? 'Original' : L[i].label,
    );
    updReset(sw);
  }
  function reset(sw) {
    const on = sw.querySelector('.opt.on[data-k="o"]');
    if (on) preview(sw, 'o', +on.dataset.i);
    if (sw.querySelector('.opt[data-k="b"]')) preview(sw, 'b', +sw.dataset.di);
    if (sw.querySelector('.opt[data-k="t"]')) preview(sw, 't', 0);
    if (sw._x && sw._x.th) preview(sw, 'th', sw._x.th.def);
    for (const k in sw._x || {}) if (k !== 'th') preview(sw, k, sw._x[k].def);
  }
  /* chip size: 12 overlay chips must fit across the preview box. Measured with one ResizeObserver instead of a CSS container query,
   which made every click re-lay out all swatches (seconds per click on long pages). */
  const chipRO = new ResizeObserver((es) => {
    for (const e of es) {
      const n = +e.target.dataset.n || 12,
        off = +e.target.dataset.off || 24,
        v =
          Math.max(
            n > 12 ? 14 : 0,
            Math.min(22, Math.floor((e.contentRect.width - off) / n)),
          ) + 'px';
      if (e.target.style.getPropertyValue('--chip') !== v)
        e.target.style.setProperty('--chip', v);
    }
  });
  document.querySelectorAll('.sw .stage').forEach((s) => chipRO.observe(s));
  /* copy: Clipboard API first; inside a sandboxed frame fall back to a hidden textarea so no selection is left behind */
  function copyHex(hex) {
    const legacy = () => {
      const ta = document.createElement('textarea');
      ta.value = hex;
      ta.setAttribute('readonly', '');
      ta.style.cssText =
        'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try {
        ok = document.execCommand('copy');
      } catch (e) {}
      ta.remove();
      getSelection().removeAllRanges();
      return ok;
    };
    try {
      if (navigator.clipboard && window.isSecureContext)
        return navigator.clipboard.writeText(hex).then(
          () => true,
          () => legacy(),
        );
    } catch (e) {}
    return Promise.resolve(legacy());
  }
  /* only a drag (text selection gesture) skips the preview; a leftover selection never blocks clicks */
  let downAt = null,
    dragged = false;
  app.addEventListener('pointerdown', (e) => {
    downAt = [e.clientX, e.clientY];
  });
  app.addEventListener('pointerup', (e) => {
    dragged =
      !!downAt &&
      Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4 &&
      !!getSelection().toString();
  });
  app.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (b && b.classList.contains('copy')) {
      copyHex(b.dataset.hex).then((ok) => {
        b.textContent = ok ? 'Copied' : b.dataset.hex;
        setTimeout(() => (b.textContent = 'Copy'), ok ? 1200 : 2500);
      });
      const row = b.closest('.opt');
      if (row && !row.classList.contains('on'))
        preview(row.closest('.sw'), row.dataset.k, +row.dataset.i);
      return;
    }
    const t = b && b.dataset.k ? b : e.target.closest('.opt');
    if (t) {
      if (!dragged) preview(t.closest('.sw'), t.dataset.k, +t.dataset.i);
      return;
    }
    if (b && b.classList.contains('reset')) {
      reset(b.closest('.sw'));
      return;
    }
  });



  /* palette and brand headings: two columns, the name with its section count and colors beside the description;
     the mood (g.mood, else the description) leads, and the technical notes (g.tech, brand harmony, page order) sit in their own block */
  (() => {
    const secs = [...app.children].filter((el) => el.tagName === 'SECTION');
    for (const g of CONFIG.groups || []) {
      const sec = secs.find((el) => el.querySelector(':scope > div > h2')?.textContent === g.title); if (!sec) continue;
      const head = sec.firstElementChild, stk = (CONFIG.pairings || []).find((p) => p.stack && p.before === g.title);
      const [desc, harm] = (g.sub || '').split(/\s*Brand harmony:\s*/);
      head.className = 'phead';
      if (g.compact) {
        const row = sec.querySelector('.brandrow');
        head.innerHTML = `<h2 class="ptitle"><span class="pname">${esc(g.title)}</span></h2><div class="pleft"><p class="mood" style="margin-top:0">${esc(desc)}</p></div>`;
        if (row) head.querySelector('.pleft').appendChild(row);
        continue;
      }
      const strip = `<span class="strip">${g.swatches.map((w, i) => `<button type="button" class="sj" data-n="${i + 1}" style="background:${w.hex}" title="Go to ${esc(w.name)} · ${w.hex}" aria-label="Go to ${esc(w.name)}"></button>`).join('')}</span>`;
      const [, num, name] = g.title.match(/^(\d+\s*·\s*)?(.*)$/);
      head.innerHTML = `<h2 class="ptitle">${num ? `<span class="pnum">${esc(num)}</span>` : ''}<span class="pname">${esc(name)}</span></h2><div class="pleft"><div class="pmeta">${strip}${g.swatches.length} sections</div><p class="mood">${esc(g.mood || desc)}</p></div>` +
        `<div class="pd"><div class="tech">${g.tech ? `<p class="note"><b>Color notes</b>${esc(g.tech)}</p>` : ''}${harm ? `<p class="note"><b>Brand harmony</b>${esc(harm.charAt(0).toUpperCase() + harm.slice(1))}</p>` : ''}${stk && stk.sub ? `<p class="note"><b>Page order</b>${esc(stk.sub)}</p>` : ''}</div></div>`;
    }
    const numw = () => document.querySelectorAll('.phead').forEach((h) => { const n = h.querySelector('.pnum'); h.style.setProperty('--numw', (n ? n.getBoundingClientRect().width : 0) + 'px'); });
    numw(); document.fonts && document.fonts.ready.then(numw); addEventListener('resize', numw);
  })();

  /* summary swatches jump to that section's row in the page-order preview */
  app.addEventListener('click', (e) => {
    const b = e.target.closest('.pmeta .sj'); if (!b) return;
    const sec = b.closest('section'), n = b.dataset.n;
    const band = [...sec.querySelectorAll('.stack .demo')].find((d) => (d.querySelector('.tag')?.textContent || '').startsWith(`Section ${n} `));
    if (!band) return;
    const bar = document.querySelector('.pbar'); band.style.scrollMarginTop = (bar ? bar.offsetHeight : 0) + 12 + 'px';
    band.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    band.classList.remove('flash'); void band.offsetWidth; band.classList.add('flash');
  });
  /* brand colors move into the header's right column */
  (() => {
    const hdr = app.querySelector('.hdr'), sec = [...app.children].find((el) => el.tagName === 'SECTION' && el.querySelector('.brandrow'));
    if (!hdr || !sec) return;
    const g = (CONFIG.groups || []).find((x) => x.compact), box = document.createElement('div'); box.className = 'hbrand';
    box.innerHTML = `<h2>${esc(g ? g.title : 'Brand colors')}</h2>${g && g.sub ? `<p>${esc(g.sub.split(/\s*Brand harmony:/)[0])}</p>` : ''}`;
    box.appendChild(sec.querySelector('.brandrow')); hdr.appendChild(box); sec.remove();
  })();
  /* each palette's page-order bands become accordions holding that section's row (preview with its options underneath) */
  (() => {
    const chev = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
    for (const sec of [...app.children].filter((el) => el.tagName === 'SECTION')) {
      const stack = sec.querySelector('.stack'), row = sec.querySelector('.row');
      if (!stack || !row) continue;
      const rows = [...row.querySelectorAll(':scope > .sw.wide')];
      for (const band of [...stack.querySelectorAll(':scope > .demo')]) {
        const tag = band.querySelector('.tag'), n = +(tag?.textContent.match(/Section (\d+)/) || [])[1];
        const sw = rows[n - 1]; if (!sw) continue;
        /* the band stays as the summary preview; a separate row under it, set off by a hairline, opens the section's options */
        const d = document.createElement('details'); d.className = 'band';
        const s = document.createElement('summary');
        s.style.background = band.style.background; s.style.color = band.style.color;
        s.innerHTML = `<span class="otog"><span class="s">Show color controls</span><span class="h">Hide color controls</span>${chev}</span>`;
        band.after(d); d.appendChild(s);
        band.classList.add('bandsum'); band.addEventListener('click', () => { if (!getSelection().toString()) d.open = !d.open; });   /* the whole section summary toggles it too */
        const body = document.createElement('div'); body.className = 'bandbody'; body.appendChild(sw); d.appendChild(body);
        body.style.borderTop = `1px solid color-mix(in srgb,${band.style.color || 'currentColor'} 22%,transparent)`;   /* hairline above the controls, same as the one above the toggle */
      }
      if (!row.children.length) row.remove();
    }

    /* details panel: no "Selected colors" title; each selected color gets an Edit button beside Copy that opens its options
       (the lists that used to sit in the Section controls / Card themes accordions) right under it; those accordions are removed */
    document.querySelectorAll('.sw .sel > .bh').forEach((h) => h.remove());
    const pen = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
    const optKey = { bg: 'o', bd: 'b', tx: 't' };
    document.querySelectorAll('.sw.wide .meta').forEach((m) => {
      const lists = {};
      m.querySelectorAll(':scope > details.acc .opts').forEach((o) => { const k = o.querySelector('.opt')?.dataset.k; if (k && !lists[k]) lists[k] = o; });
      m.querySelectorAll('.sel .srow[data-s]').forEach((r) => {
        const o = lists[optKey[r.dataset.s] || r.dataset.s]; if (!o) return;
        const it = document.createElement('div'); it.className = 'sitem acc';   /* "acc" so option code finds its current-value slot */
        r.replaceWith(it); it.appendChild(r);
        const nm = (r.querySelector('small')?.textContent || '').split(' · ')[0];
        r.insertAdjacentHTML('beforeend', `<button class="edit" type="button" aria-expanded="false" aria-label="Edit ${esc(nm)}" title="Edit ${esc(nm)}">${pen}</button>`);
        const box = document.createElement('div'); box.className = 'sopts'; box.hidden = true; box.innerHTML = '<span class="cur" hidden></span>';
        box.appendChild(o); it.appendChild(box);
      });
      m.querySelectorAll(':scope > details.acc').forEach((d) => d.remove());
    });
    app.addEventListener('click', (e) => {
      const b = e.target.closest('button.edit'); if (!b) return;
      const it = b.closest('.sitem'), box = it.querySelector(':scope > .sopts'), on = box.hidden;
      box.hidden = !on; it.classList.toggle('open', on); b.setAttribute('aria-expanded', on);
    });
    /* Selected colors: each group heading (Section controls, Card themes) and its box become one collapsible group, open by default */
    document.querySelectorAll('.sw .sel > .sh').forEach((h) => {
      const box = h.nextElementSibling; if (!box || !box.classList.contains('sbox')) return;
      const d = document.createElement('details'); d.className = 'sgrp'; d.open = true;
      const s = document.createElement('summary'); s.className = 'sh'; s.textContent = h.textContent;
      h.replaceWith(d); d.append(s, box);
    });
  })();
  /* sticky palette bar: shows the palette scrolled to; its dropdown previews each palette's sections and jumps to it */
  (() => {
    const pals = (CONFIG.groups || []).filter((g) => !g.compact && g.swatches && g.swatches.length);
    if (pals.length < 2) return;
    const secs = [...app.children].filter((el) => el.tagName === 'SECTION');
    const items = pals.map((g) => ({ g, el: secs.find((el) => el.querySelector('h2')?.textContent === g.title) })).filter((x) => x.el);
    items.forEach((x, i) => (x.el.dataset.pal = i));
    const strip = (g) => `<span class="strip" aria-hidden="true">${g.swatches.map((w) => `<i style="background:${w.hex}"></i>`).join('')}</span>`;
    const blurb = (g) => esc((g.mood || g.sub || '').split(/: |\. /)[0].replace(/\.$/, '') + '.');
    const nav = document.createElement('nav');
    nav.className = 'pbar'; nav.setAttribute('aria-label', 'Palettes');
    nav.innerHTML = `<div class="in"><span class="lbl">Palette</span><button class="pick" type="button" aria-haspopup="true" aria-expanded="false"><span class="nm"></span><span class="cur"></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="menu" hidden>${items.map((x, i) => `<button class="opt" type="button" data-i="${i}"><b>${esc(x.g.title)}</b>${strip(x.g)}<small>${x.g.swatches.length} sections · ${blurb(x.g)}</small></button>`).join('')}</div></div>`;
    document.body.insertBefore(nav, app);
    const pick = nav.querySelector('.pick'), menu = nav.querySelector('.menu'), opts = [...menu.querySelectorAll('.opt')];
    let cur = -2;
    const show = (i) => {
      if (i === cur) return; cur = i;
      pick.querySelector('.nm').textContent = i < 0 ? 'Jump to a palette' : items[i].g.title;
      pick.querySelector('.cur').innerHTML = i < 0 ? '' : strip(items[i].g);
      opts.forEach((o, j) => o.setAttribute('aria-current', j === i));
    };
    const track = () => {
      const y = nav.getBoundingClientRect().bottom + 24; let i = -1;
      items.forEach((x, j) => { if (x.el.getBoundingClientRect().top <= y) i = j; });
      show(i);
    };
    let raf = 0;
    addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; track(); }); }, { passive: true });
    const margin = () => items.forEach((x) => (x.el.style.scrollMarginTop = nav.offsetHeight + 12 + 'px'));
    addEventListener('resize', () => { margin(); track(); });
    const open = (on) => { menu.hidden = !on; pick.setAttribute('aria-expanded', on); if (on) (opts[Math.max(cur, 0)] || opts[0]).focus(); };
    pick.addEventListener('click', () => open(menu.hidden));
    menu.addEventListener('click', (e) => {
      const o = e.target.closest('.opt'); if (!o) return;
      const el = items[+o.dataset.i].el;
      open(false); pick.focus({ preventScroll: true }); el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    });
    menu.addEventListener('keydown', (e) => {
      const k = opts.indexOf(document.activeElement);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); opts[(k + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length].focus(); }
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !menu.hidden) { open(false); pick.focus(); } });
    document.addEventListener('click', (e) => { if (!menu.hidden && !nav.contains(e.target)) open(false); });
    margin(); track();
  })();
</script>
